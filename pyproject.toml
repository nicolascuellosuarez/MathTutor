[project]
name = "mathtutor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nicolás Cuello", email = "jaimecuellosuarez@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "latex>=0.7.0",
    "manim>=0.22.1",
    "matplotlib>=3.11.2",
    "mermaid-py>=0.9.0",
    "mkdocs>=1.6.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "radon>=6.0.1",
    "ruff>=0.17.5",
    "sympy>=1.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
mathtutor = "mathtutor:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
